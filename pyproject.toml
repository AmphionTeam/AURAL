[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aural-reasoning"
version = "0.1.0"
description = "Adaptive latent reasoning with joint chunks for speech language models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchvision==0.24.0",
    "transformers==4.57.6",
    "ms-swift==4.3.2",
    "accelerate==1.13.0",
    "peft==0.19.1",
    "trl==0.29.1",
    "datasets==4.8.4",
    "huggingface-hub==0.36.2",
    "safetensors==0.7.0",
    "qwen-omni-utils==0.0.9",
    "soundfile==0.13.1",
    "audioread==3.1.0",
    "librosa==0.11.0",
    "av==17.0.1",
    "pyarrow==24.0.0",
    "numpy==2.2.6",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
train = ["deepspeed==0.19.1"]

[tool.setuptools.packages.find]
include = ["aural*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
